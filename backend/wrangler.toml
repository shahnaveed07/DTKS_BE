name = "dtks-backend-api"
main = "src/index.js"
compatibility_date = "2025-02-01"
workers_dev = false

# Custom domain / route configuration for DTKS Production API
# Preserve existing frontend deployment at https://dreamtechkashmirsolutions.studio/
# Mount backend Worker at api.dreamtechkashmirsolutions.studio or /api/v1/*
routes = [
  { pattern = "api.dreamtechkashmirsolutions.studio/*", zone_name = "dreamtechkashmirsolutions.studio" },
  { pattern = "dreamtechkashmirsolutions.studio/api/v1/*", zone_name = "dreamtechkashmirsolutions.studio" }
]

[vars]
CORS_ALLOWED_ORIGINS = "https://dreamtechkashmirsolutions.studio,https://www.dreamtechkashmirsolutions.studio"
JWT_ACCESS_EXPIRES_IN = "3600"
JWT_REFRESH_EXPIRES_IN = "604800"
EMAIL_FROM_ADDRESS = "notifications@dreamtechkashmirsolutions.studio"
ADMIN_NOTIFICATION_EMAIL = "contact@dreamtechkashmirsolutions.studio"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "dtks-production-db"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "migrations"

# Cloudflare R2 Object Storage Binding for Portfolio & Team Assets
[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "dtks-portfolio-assets"
