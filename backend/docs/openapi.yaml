openapi: 3.0.3
info:
  title: DreamTech Kashmir Solutions (DTKS) Backend API
  version: 1.0.0
  description: >
    Standalone production REST API for DreamTech Kashmir Solutions (https://dreamtechkashmirsolutions.studio/),
    powered by Cloudflare Workers, Cloudflare D1 (SQLite), and Cloudflare R2 object storage.
    Consumed by the separate DTKS frontend repository (https://github.com/shahnaveed07/DTKS.git) via VITE_API_BASE_URL.
    Features WebCrypto PBKDF2-HMAC-SHA512 ($pbkdf2-sha512$) password hashing with transparent legacy hash migration,
    distributed D1 sliding-window rate limiting, and granular Role-Based Access Control (super_admin, admin, editor).
  contact:
    name: DreamTech Kashmir Solutions Engineering
    email: dreamtechkashmirsolutions@gmail.com
    url: https://dreamtechkashmirsolutions.studio
servers:
  - url: https://api.dreamtechkashmirsolutions.studio/api/v1
    description: Production Cloudflare Workers API Subdomain
  - url: https://dreamtechkashmirsolutions.studio/api/v1
    description: Production Same-Origin Cloudflare Workers Route
  - url: http://localhost:8787/api/v1
    description: Local Wrangler Development Server
  - url: http://localhost:3000/api/v1
    description: Local Node Development Server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived (15m) HMAC-SHA256 Admin JWT access token (`accountType: "admin"`) issued by POST /auth/login or POST /auth/refresh. Enforces role-based access control (super_admin, admin, editor).
    ClientBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived (15m) HMAC-SHA256 Client JWT access token (`accountType: "client"`) issued by POST /client/auth/login or POST /client/auth/refresh. Isolated from Admin endpoints.
  schemas:
    StandardSuccessResponse:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object
    StandardErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
            details:
              type: object
              nullable: true
    Service:
      type: object
      properties:
        id: { type: string, example: svc-business-websites }
        title: { type: string, example: Business & Corporate Websites }
        slug: { type: string, example: business-corporate-websites }
        description: { type: string }
        features:
          type: array
          items: { type: string }
        image: { type: string }
        price: { type: number, nullable: true, example: 15000 }
        is_active: { type: boolean, example: true }
        display_order: { type: integer, example: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Package:
      type: object
      properties:
        id: { type: string, example: pkg-business-website }
        name: { type: string, example: Business Website Package }
        description: { type: string }
        price: { type: number, nullable: true, example: 16500 }
        features:
          type: array
          items: { type: string }
        service_id: { type: string, nullable: true, example: svc-business-websites }
        is_active: { type: boolean, example: true }
        display_order: { type: integer, example: 2 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PortfolioItem:
      type: object
      properties:
        id: { type: string, example: port-1 }
        project_title: { type: string, example: Zabarwan Royal Retreat — Boutique Hotel Website }
        slug: { type: string, example: zabarwan-royal-retreat-hotel-website }
        description: { type: string }
        category: { type: string, example: Restaurant & Hotel Websites }
        thumbnail: { type: string }
        images:
          type: array
          items: { type: string }
        project_url: { type: string }
        is_published: { type: boolean, example: true }
        display_order: { type: integer, example: 1 }
        created_at: { type: string, format: date-time }
    Order:
      type: object
      properties:
        id: { type: string, example: ord-seed-1 }
        order_number: { type: string, example: DKS-2026-0001 }
        customer_id: { type: string, nullable: true }
        service_id: { type: string, nullable: true }
        package_id: { type: string, nullable: true }
        customer_name: { type: string }
        customer_email: { type: string, format: email }
        customer_phone: { type: string }
        project_description: { type: string }
        budget: { type: string }
        status:
          type: string
          enum:
            - Pending
            - New Request
            - Reviewed
            - Under Review
            - Requirements Clarification
            - Quotation Sent
            - Awaiting Customer Approval
            - Approved
            - InProgress
            - In Progress
            - Under Testing
            - Completed
            - Rejected
            - Cancelled
        admin_notes: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ContactMessage:
      type: object
      properties:
        id: { type: string, example: inq-1 }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        subject: { type: string }
        message: { type: string }
        status:
          type: string
          enum: [New, Read, In Review, Replied, Archived]
        created_at: { type: string, format: date-time }

    AdminAccount:
      type: object
      properties:
        id: { type: string, example: adm-dtks-initial }
        name: { type: string, example: Principal Super Admin }
        email: { type: string, format: email }
        role:
          type: string
          enum: [super_admin, admin, editor]
        isActive: { type: boolean }
        invitePending: { type: boolean }
        invitedByAdminId: { type: string, nullable: true }
        inviteAcceptedAt: { type: string, format: date-time, nullable: true }
        inviteExpiresAt: { type: string, format: date-time, nullable: true }
        inviteExpired: { type: boolean }
        activeSessions: { type: integer, example: 1 }
        activeSessionCount: { type: integer, example: 1 }
        deactivatedAt: { type: string, format: date-time, nullable: true }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ClientAccount:
      type: object
      properties:
        id: { type: string, example: cacc_123 }
        customerId: { type: string, nullable: true }
        fullName: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        city: { type: string }
        businessName: { type: string }
        isEmailVerified: { type: boolean }
        emailVerifiedAt: { type: string, format: date-time, nullable: true }
        isActive: { type: boolean }
        deactivatedAt: { type: string, format: date-time, nullable: true }
        termsAccepted: { type: boolean }
        termsAcceptedAt: { type: string, format: date-time, nullable: true }
        termsVersion: { type: string }
        privacyAccepted: { type: boolean }
        privacyAcceptedAt: { type: string, format: date-time, nullable: true }
        privacyVersion: { type: string }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PaginationMeta:
      type: object
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        total: { type: integer, example: 3 }
        totalPages: { type: integer, example: 1 }
        hasNextPage: { type: boolean, example: false }
        hasPrevPage: { type: boolean, example: false }

paths:
  /health:
    get:
      summary: Worker Liveness Check (Independent of D1/R2)
      tags: [System]
      responses:
        '200':
          description: Worker is running and operational
  /ready:
    get:
      summary: Infrastructure Readiness Check (Verifies D1 Connection, 17 Schema Tables & R2 Storage)
      tags: [System]
      responses:
        '200':
          description: D1 database, schema tables, and R2 storage are ready
        '503':
          description: One or more required dependencies (D1, schema tables, or R2) are not ready
  /auth/login:
    post:
      summary: Admin Login
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Authenticated successfully
        '401':
          description: Invalid credentials
  /auth/refresh:
    post:
      summary: Rotate Refresh Token
      tags: [Authentication]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New access & refresh tokens issued
        '401':
          description: Invalid or expired refresh token
  /auth/logout:
    post:
      summary: Admin Logout & Session Revocation
      tags: [Authentication]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
                allDevices: { type: boolean, default: false }
      responses:
        '200':
          description: Logged out (`scope` is `single_device` or `all_devices`)
        '401':
          description: Unauthorized (e.g. `allDevices: true` without authenticated admin)
  /auth/me:
    get:
      summary: Get Current Authenticated Admin
      tags: [Authentication]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current admin profile
        '401':
          description: Unauthorized
  /auth/profile:
    patch:
      summary: Update Current Admin Name
      tags: [Authentication]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2 }
      responses:
        '200':
          description: Profile updated
        '400':
          description: Validation error or forbidden field modification attempted
    put:
      summary: Update Current Admin Name (PUT alias)
      tags: [Authentication]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2 }
      responses:
        '200':
          description: Profile updated
  /auth/change-password:
    post:
      summary: Change Admin Password
      tags: [Authentication]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
                confirmPassword: { type: string, minLength: 8 }
      responses:
        '200':
          description: Password updated and refresh sessions revoked
  /auth/accept-invite:
    post:
      summary: Accept Admin Invitation & Set Password (Public)
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password, confirmPassword]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
                confirmPassword: { type: string, minLength: 8 }
      responses:
        '200':
          description: Admin account activated
        '400':
          description: Invalid, expired, or already-used token or weak password
  /admin/accounts:
    get:
      summary: List Admin Accounts (super_admin, admin)
      tags: [Admin Accounts]
      security:
        - BearerAuth: []
      parameters:
        - name: role
          in: query
          schema: { type: string, enum: [super_admin, admin, editor, all] }
        - name: status
          in: query
          schema: { type: string, enum: [all, active, inactive, pending, expired] }
        - name: isActive
          in: query
          schema: { type: boolean }
        - name: search
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Filtered admin accounts list and pagination metadata (`data.accounts`, `data.pagination`)
        '403':
          description: Forbidden for editor role
    post:
      summary: Create Pending Admin Account & Send Invitation Email (super_admin only)
      tags: [Admin Accounts]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, role]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                role: { type: string, enum: [super_admin, admin, editor] }
      responses:
        '201':
          description: Pending admin created and invite email sent
        '403':
          description: Forbidden (super_admin only)
        '409':
          description: Admin email already exists
        '503':
          description: Account created in pending state but email provider unavailable/failed
  /admin/accounts/{id}:
    get:
      summary: Inspect Admin Account, Sessions & Latest Invite (super_admin, admin)
      tags: [Admin Accounts]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Admin account details
        '404':
          description: Not found
    patch:
      summary: Update Admin Name or Role (super_admin only)
      tags: [Admin Accounts]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                role: { type: string, enum: [super_admin, admin, editor] }
      responses:
        '200':
          description: Admin account updated
        '409':
          description: Cannot demote last active super_admin
    put:
      summary: Update Admin Name or Role (PUT alias, super_admin only)
      tags: [Admin Accounts]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Admin account updated
  /admin/accounts/{id}/resend-invite:
    post:
      summary: Resend Invitation Email for Pending Admin (super_admin only)
      tags: [Admin Accounts]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Invitation email resent
        '503':
          description: Email provider unavailable/failed
  /admin/accounts/{id}/status:
    patch:
      summary: Activate or Deactivate Admin Account (super_admin only)
      tags: [Admin Accounts]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive]
              properties:
                isActive: { type: boolean }
      responses:
        '200':
          description: Admin status updated
        '409':
          description: Cannot deactivate last active super_admin
    put:
      summary: Activate or Deactivate Admin Account (PUT alias, super_admin only)
      tags: [Admin Accounts]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Admin status updated
  /admin/accounts/{id}/sessions:
    delete:
      summary: Revoke All Active Sessions for Admin Account (super_admin only)
      tags: [Admin Accounts]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Sessions revoked and token_version incremented
  /client/auth/register:
    post:
      summary: Register Public Client Account (Requires Email Verification)
      tags: [Client Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, email, phone, password, confirmPassword, acceptTerms]
              properties:
                fullName: { type: string }
                email: { type: string, format: email }
                phone: { type: string }
                city: { type: string }
                businessName: { type: string }
                password: { type: string, minLength: 8 }
                confirmPassword: { type: string, minLength: 8 }
                acceptTerms: { type: boolean, enum: [true] }
                acceptPrivacy: { type: boolean }
      responses:
        '201':
          description: Client registered with persisted legal acceptance and verification email dispatched
        '400':
          description: Validation error (including missing acceptTerms or password mismatch)
        '409':
          description: Registration conflict
        '503':
          description: Account created pending verification, but email provider unavailable/failed (`accountCreated`, `accountPendingVerification`, `verificationEmailSent`, `canResendVerification`, `deliveryStatus`)
  /client/auth/resend-verification:
    post:
      summary: Resend Client Verification Email
      tags: [Client Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Uniform confirmation returned when provider is configured and dispatch succeeds (or email does not match an active unverified account)
        '503':
          description: Email provider unconfigured or upstream Resend delivery failed (`EMAIL_PROVIDER_UNCONFIGURED` / `EMAIL_DELIVERY_FAILED`)
  /client/auth/verify-email:
    post:
      summary: Verify Client Email & Safely Link Existing Customer Record
      tags: [Client Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: Email verified and customer record linked
        '400':
          description: Invalid, expired, or already-used verification token
  /client/auth/login:
    post:
      summary: Client Login (Verified, Active Clients Only)
      tags: [Client Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Authenticated successfully
        '401':
          description: Invalid credentials
        '403':
          description: Email not verified or account deactivated
  /client/auth/refresh:
    post:
      summary: Rotate Client Refresh Token
      tags: [Client Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: New client token pair issued
        '401':
          description: Invalid or expired refresh token
  /client/auth/logout:
    post:
      summary: Client Logout & Single-Device or All-Devices Session Revocation
      tags: [Client Authentication]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
                allDevices: { type: boolean, default: false }
      responses:
        '200':
          description: Logged out (`allDevices`, `scope` [`single_device` | `all_devices`], `sessionsRevoked`)
        '401':
          description: Unauthorized (e.g. `allDevices: true` without authenticated client session)
  /client/auth/me:
    get:
      summary: Get Current Authenticated Client Profile
      tags: [Client Authentication]
      security:
        - ClientBearerAuth: []
      responses:
        '200':
          description: Current client profile
        '401':
          description: Unauthorized or non-client token
  /client/auth/profile:
    patch:
      summary: Update Current Client Profile
      tags: [Client Authentication]
      security:
        - ClientBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: { type: string }
                phone: { type: string }
                city: { type: string }
                businessName: { type: string }
      responses:
        '200':
          description: Profile updated
    put:
      summary: Update Current Client Profile (PUT alias)
      tags: [Client Authentication]
      security:
        - ClientBearerAuth: []
      responses:
        '200':
          description: Profile updated
  /client/auth/change-password:
    post:
      summary: Change Client Password
      tags: [Client Authentication]
      security:
        - ClientBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
                confirmPassword: { type: string, minLength: 8 }
      responses:
        '200':
          description: Password updated and active sessions revoked
  /client/auth/forgot-password:
    post:
      summary: Request Client Password Reset Email
      tags: [Client Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Uniform confirmation returned when provider is configured
        '503':
          description: Email provider unconfigured
  /client/auth/reset-password:
    post:
      summary: Reset Client Password with Single-Use Token
      tags: [Client Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, confirmPassword]
              description: Provide either `password` or `newPassword` along with matching `confirmPassword`.
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
                newPassword: { type: string, minLength: 8 }
                confirmPassword: { type: string, minLength: 8 }
      responses:
        '200':
          description: Password reset and existing sessions revoked
        '400':
          description: Invalid, expired, or used token, missing confirmation, or weak password
  /client/auth/deactivate:
    post:
      summary: Deactivate Current Client Account
      tags: [Client Authentication]
      security:
        - ClientBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '200':
          description: Client account deactivated and all sessions revoked
  /client/orders:
    get:
      summary: List Authenticated Client Orders (Scoped to Client Customer ID)
      tags: [Client Portal]
      security:
        - ClientBearerAuth: []
      parameters:
        - name: status
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Client orders without internal admin_notes
  /client/orders/{id}:
    get:
      summary: Get Single Client Order Details & Status History
      tags: [Client Portal]
      security:
        - ClientBearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Client order details without internal admin_notes
        '404':
          description: Order not found or owned by another customer
  /client/quotations:
    get:
      summary: List Client Quotations
      tags: [Client Portal]
      security:
        - ClientBearerAuth: []
      responses:
        '200':
          description: Client quotations
  /client/projects:
    get:
      summary: List Client Active & Completed Projects
      tags: [Client Portal]
      security:
        - ClientBearerAuth: []
      responses:
        '200':
          description: Client projects
  /services:
    get:
      summary: List Active Services (Public) or All Services (Admin)
      tags: [Services]
      responses:
        '200':
          description: Services list
    post:
      summary: Create Website Service (Admin)
      tags: [Services]
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Service created
    put:
      summary: Bulk Sync Website Services Catalog (super_admin / admin)
      tags: [Services]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: array
                  items: { $ref: '#/components/schemas/Service' }
                - type: object
                  properties:
                    services:
                      type: array
                      items: { $ref: '#/components/schemas/Service' }
      responses:
        '200':
          description: Services catalog synced
        '403':
          description: Forbidden for editor role
  /services/{slugOrId}:
    get:
